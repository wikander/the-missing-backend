info:
  name: Get short-circuit
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/short-circuit"
  params:
    - name: mitten-sleep
      value: "[200,800]"
      type: query
      description: "missingbe: delay in ms, 500 or [min,max]; replaces mitten_default_sleep, removed before forwarding"
      disabled: true
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Through mitmproxy these are answered by the mitten-mock-short-circuit-*.json
  mocks and never reach the test server, so its log stays empty.

  **Test server directly:** 200 with a dummy record in `data`.

  **Through mitmproxy:** 200 with `variant` 1 or 2, picked at random between two mock files.
