info:
  name: Put short-circuit
  type: http
  seq: 3
http:
  method: PUT
  url: "{{baseUrl}}/short-circuit"
  params:
    - name: mitten-sleep
      value: "[200,800]"
      type: query
      description: "missingbe: delay in ms, 500 or [min,max]; replaces mitten_default_sleep, removed before forwarding"
      disabled: true
  body:
    type: json
    data: |-
      {
        "name": "sent from Bruno"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Through mitmproxy these are answered by the mitten-mock-short-circuit-*.json
  mocks and never reach the test server, so its log stays empty.

  **Test server directly:** 200 and echoes the body.

  **Through mitmproxy:** 200 `{"message": "replaced by the mock"}`.
