info:
  name: Post short-circuit
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/short-circuit"
  params:
    - name: sleep
      value: "2000"
      type: query
      description: "missingbe: delay the request this many ms in mitmproxy; removed before forwarding"
      disabled: true
  body:
    type: json
    data: |-
      {
        "name": "sent from Bruno"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Through mitmproxy these are answered by the mitten-mock-short-circuit-*.json
  mocks and never reach the test server, so its log stays empty.

  **Test server directly:** 201 and echoes the body.

  **Through mitmproxy:** 201 with `Location: /short-circuit/42` and `{"id": 42}`.
