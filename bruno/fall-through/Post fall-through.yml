info:
  name: Post fall-through
  type: http
  seq: 2
http:
  method: POST
  url: "{{baseUrl}}/fall-through"
  params:
    - name: sleep
      value: "2000"
      type: query
      description: "missingbe: delay the request this many ms in mitmproxy; removed before forwarding"
      disabled: true
  body:
    type: json
    data: |-
      {
        "name": "sent from Bruno"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Through mitmproxy the mitten-mock-fall-through-*.json mocks alter these,
  but they are still forwarded, so the test server logs each one with the
  `X-Mocked-By: missingbe` header the mock added.

  **Test server directly:** 201 and echoes the body.

  **Through mitmproxy:** The body is replaced with `{"altered": true}` before forwarding,
  and the response status becomes 202 with `X-Mocked: true`.
