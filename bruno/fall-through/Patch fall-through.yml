info:
  name: Patch fall-through
  type: http
  seq: 4
http:
  method: PATCH
  url: "{{baseUrl}}/fall-through"
  params:
    - name: mitten-sleep
      value: "[200,800]"
      type: query
      description: "missingbe: delay in ms, 500 or [min,max]; replaces mitten_default_sleep, removed before forwarding"
      disabled: true
  body:
    type: json
    data: |-
      {
        "name": "sent from Bruno"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Through mitmproxy the mitten-mock-fall-through-*.json mocks alter these,
  but they are still forwarded, so the test server logs each one with the
  `X-Mocked-By: missingbe` header the mock added.

  **Test server directly:** 200 with your body merged into the dummy record.

  **Through mitmproxy:** Forwarded as sent; the server's answer body is replaced by the mock.
