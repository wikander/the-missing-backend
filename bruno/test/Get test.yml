info:
  name: Get test
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/test"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  The test server answers 200 `{"message": "hello"}`.

  Through mitmproxy with `example-responses`, a GET mock short-circuits it
  and the test server is never called.
