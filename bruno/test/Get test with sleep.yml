info:
  name: Get test with sleep
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/test?sleep=2000"
  params:
    - name: sleep
      value: "2000"
      type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  `?sleep=<ms>` makes mitmproxy delay the request. The parameter is removed
  before the request is forwarded.

  Against the test server directly, it has no effect.
