[project]
name = "the-missing-backend"
version = "0.1.0"
description = "A mitmproxy addon that mocks or alters HTTP traffic from JSON mock files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "flask>=3.1.2",
    "pytest>=9.2.0",
]
